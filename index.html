<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timer">
<meta name="theme-color" content="#000000">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
<title>Web Timer</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="modes" role="tablist">
    <button class="mode active" data-mode="up" role="tab">STOPWATCH</button>
    <button class="mode" data-mode="down" role="tab">COUNTDOWN</button>
  </nav>
  <button id="mute" class="mute" aria-pressed="false" aria-label="サウンドオン">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
      <path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path class="cross" d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </button>

  <main class="display-wrap">
    <div id="display" class="display" role="timer" aria-live="off"></div>

    <div id="setter" class="setter hidden">
      <div class="unit">
        <button class="adj" data-unit="h" data-d="1">+</button>
        <span class="label">H</span>
        <button class="adj" data-unit="h" data-d="-1">−</button>
      </div>
      <div class="unit">
        <button class="adj" data-unit="m" data-d="1">+</button>
        <span class="label">M</span>
        <button class="adj" data-unit="m" data-d="-1">−</button>
      </div>
      <div class="unit">
        <button class="adj" data-unit="s" data-d="1">+</button>
        <span class="label">S</span>
        <button class="adj" data-unit="s" data-d="-1">−</button>
      </div>
    </div>
  </main>

  <footer class="controls">
    <button id="reset" class="ctl">RESET</button>
    <button id="start" class="ctl primary">START</button>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
